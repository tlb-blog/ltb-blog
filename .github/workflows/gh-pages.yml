name: Build and Deploy VuePress to GitHub Pages

on:
  push:
    branches: [main, master]

# GitHub Actions の権限設定
permissions:
  contents: read
  pages: write
  id-token: write

# concurrency グループを設定してデプロイの競合を防ぐ
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build VuePress site
        run: npm run build
        env:
          CI: true
          SITE_HOSTNAME: https://tlb-blog.github.io
          BASE_URL: /ltb-blog/

      - name: Generate sitemap and RSS
        run: |
          # Ensure postbuild output exists; run explicitly for reliability
          node ./scripts/generate-sitemap.js || echo "sitemap generation failed"
          node ./scripts/generate-rss.js || echo "rss generation failed"

      - name: Apply path patches
        run: |
          # PowerShell Core を使用してパッチスクリプトを実行
          pwsh -File ./scripts/patch-dist.ps1
        shell: bash

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/.vuepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
